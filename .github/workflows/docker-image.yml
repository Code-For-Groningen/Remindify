name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Read version from VERSION file
      id: version
      run: echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT

    - name: Login to GitHub Container Registry
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build the Docker image
      run: |
          docker build . --file Dockerfile --tag ghcr.io/code-for-groningen/remindify:${{ steps.version.outputs.version }}
          docker build . --file Dockerfile --tag ghcr.io/code-for-groningen/remindify:latest

    - name: Push Docker image (main only)
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
          docker push ghcr.io/code-for-groningen/remindify:${{ steps.version.outputs.version }}
          docker push ghcr.io/code-for-groningen/remindify:latest
      
